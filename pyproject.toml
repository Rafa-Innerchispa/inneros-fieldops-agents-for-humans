[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inneros-fieldops"
version = "0.1.0"
description = "Governed, verifiable field operations layer for InnerOS"
requires-python = ">=3.11"
