[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inneros-fieldops"
version = "0.1.0"
description = "Governed, verifiable field operations layer for InnerOS"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.optional-dependencies]
test = [
    "pytest>=8",
]
aws = [
    "strands-agents[bedrock]>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
