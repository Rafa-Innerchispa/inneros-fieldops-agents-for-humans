<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">InnerOS FieldOps governed execution architecture</title>
  <desc id="desc">Request flows through routing, approval, bounded execution, verification and evidence receipt.</desc>
  <defs>
    <linearGradient id="band" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1120" height="620" fill="url(#band)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="56" y="62" font-size="30" font-weight="700" fill="#102033">InnerOS FieldOps</text>
    <text x="56" y="96" font-size="16" fill="#526173">Cloud intelligence, sovereign execution, verified outcomes.</text>
    <g fill="#ffffff" stroke="#d5dee8" stroke-width="2" filter="url(#shadow)">
      <rect x="56" y="148" width="196" height="108" rx="14"/>
      <rect x="316" y="148" width="196" height="108" rx="14"/>
      <rect x="576" y="148" width="196" height="108" rx="14"/>
      <rect x="836" y="148" width="228" height="108" rx="14"/>
      <rect x="184" y="356" width="228" height="120" rx="14"/>
      <rect x="508" y="356" width="228" height="120" rx="14"/>
      <rect x="832" y="356" width="232" height="120" rx="14"/>
    </g>
    <g fill="#102033" font-size="18" font-weight="700">
      <text x="84" y="188">Request</text>
      <text x="344" y="188">Routing</text>
      <text x="604" y="188">Approval Gate</text>
      <text x="864" y="188">Bounded Action</text>
      <text x="212" y="398">Independent</text>
      <text x="536" y="398">Evidence Receipt</text>
      <text x="860" y="398">Audit Replay</text>
    </g>
    <g fill="#526173" font-size="14">
      <text x="84" y="216">Objective, incident,</text>
      <text x="84" y="236">or field workflow</text>
      <text x="344" y="216">Local-first model</text>
      <text x="344" y="236">and tool selection</text>
      <text x="604" y="216">Human approval for</text>
      <text x="604" y="236">risky operations</text>
      <text x="864" y="216">Edge node, API,</text>
      <text x="864" y="236">or technician step</text>
      <text x="212" y="426">Verifier observes</text>
      <text x="212" y="446">actual state</text>
      <text x="536" y="426">Hashes, route, result,</text>
      <text x="536" y="446">quality gate</text>
      <text x="860" y="426">Replayable evidence</text>
      <text x="860" y="446">without production access</text>
    </g>
    <g stroke="#1a7f64" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M252 202h64"/>
      <path d="M512 202h64"/>
      <path d="M772 202h64"/>
      <path d="M950 256v56c0 30-24 54-54 54H736"/>
      <path d="M508 416h-96"/>
      <path d="M736 416h96"/>
    </g>
    <g fill="#1a7f64">
      <path d="m310 193 14 9-14 9z"/>
      <path d="m570 193 14 9-14 9z"/>
      <path d="m830 193 14 9-14 9z"/>
      <path d="m742 407-14 9 14 9z"/>
      <path d="m826 407 14 9-14 9z"/>
    </g>
    <rect x="56" y="526" width="1008" height="44" rx="10" fill="#102033"/>
    <text x="82" y="554" font-size="15" fill="#ffffff">Safety invariant: no arbitrary shell, no arbitrary network, no risky action without approval, and no success without independent verification.</text>
  </g>
</svg>
